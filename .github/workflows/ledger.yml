# The Saktum trust ledger bot: an issue titled "Attest: <server>" whose body holds a signed Saktum attestation (made with
# `saktum attest --publish`) is verified and appended to docs/ledger/ledger.jsonl, an append-only, hash-chained log.
# This job writes to the repository, so it never runs anyone's code: the issue body is data, read through an environment
# variable and parsed as JSON by Saktum's own verifier. Appends are serialised so the chain cannot fork.
name: ledger
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: ledger
  cancel-in-progress: false
jobs:
  append:
    if: startsWith(github.event.issue.title, 'Attest:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Verify and append
        id: append
        env: { BODY: "${{ github.event.issue.body }}", ISSUE: "${{ github.event.issue.number }}" }
        run: |
          printf '%s' "$BODY" | head -c 40000 > /tmp/body.md
          if npx -y saktum@0.12.0 ledger append /tmp/body.md --ledger docs/ledger/ledger.jsonl --issue "$ISSUE" > /tmp/out.txt 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          cat /tmp/out.txt
      - name: Commit the new entry
        if: steps.append.outputs.ok == 'true'
        run: |
          npx -y saktum@0.12.0 ledger verify docs/ledger/ledger.jsonl
          npx -y saktum@0.12.0 ledger pages docs/ledger/ledger.jsonl --out docs/passports
          git config user.name "saktum-ledger-bot"
          git config user.email "saktum-ledger-bot@users.noreply.github.com"
          git add docs/ledger/ledger.jsonl docs/passports
          git commit -m "Ledger: entry for issue #${{ github.event.issue.number }}"
          git push
      - name: Reply
        if: always()
        env: { GH_TOKEN: "${{ github.token }}", ISSUE: "${{ github.event.issue.number }}", OK: "${{ steps.append.outputs.ok }}" }
        run: |
          if [ "$OK" = "true" ]; then
            { echo "Recorded in the public Saktum trust ledger:"; echo; echo '```'; tail -c 2000 /tmp/out.txt; echo '```'; echo; echo "Anyone can verify the whole ledger with \`npx saktum ledger verify\`. Entries are signed claims; the assurance level is stated in each."; echo; echo "Passport: https://soodhere.github.io/saktum-index/passports/"; } > reply.md
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file reply.md
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
          else
            { echo "Not recorded:"; echo; echo '```'; tail -c 2000 /tmp/out.txt 2>/dev/null; echo '```'; echo; echo "Make the attestation with \`npx saktum attest saktum-report.json --publish\` and use the link it prints."; } > reply.md
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file reply.md
          fi
